<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SRSS Design QA Comparison</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; background: #d7d7d7; font-family: Arial, sans-serif; }
      main { display: grid; grid-template-columns: 1fr 1fr; gap: 2px; min-height: 100vh; }
      figure { margin: 0; padding: 34px 8px 8px; position: relative; background: #fff; }
      figcaption { position: absolute; inset: 10px auto auto 16px; color: #06162f; font-size: 13px; font-weight: 700; }
      img { display: block; width: 100%; height: auto; border: 1px solid #c7c7c7; }
    </style>
  </head>
  <body>
    <main>
      <figure><figcaption>Source visual target</figcaption><img src="/design-reference.png" alt="Source design" /></figure>
      <figure><figcaption>Browser implementation · 1440 × 1024</figcaption><img src="/implementation-desktop.png" alt="Rendered implementation" /></figure>
    </main>
  </body>
</html>
