<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0}#c{box-sizing:border-box}#c{display:grid;grid-template-columns:1fr 1fr;height:160px}
.p{padding:18px 20px;display:flex;flex-direction:column;gap:14px;justify-content:center}
.e{font:var(--fw-semibold) 13px/1.3 var(--font-body);letter-spacing:.14em;text-transform:uppercase}
.e2{font:var(--fw-semibold) 11px/1.3 var(--font-body);letter-spacing:.14em;text-transform:uppercase}</style></head><body>
<div id="c">
<div class="p" style="background:var(--navy-800)">
  <span class="e" style="color:var(--gold-300)">Sekolah Rendah Sathya Sai · Since 2002</span>
  <span class="e2" style="color:var(--gold-300)">Silver Jubilee · 2027</span>
  <span class="e2" style="color:rgba(255,255,255,.62)">Updates</span>
</div>
<div class="p" style="background:var(--cream-50)">
  <span class="e" style="color:var(--gold-600)">Reflection · 5 min read</span>
  <span class="e2" style="color:var(--navy-600)">Child's full name *</span>
  <span class="e2" style="color:var(--navy-500)">Address</span>
</div>
</div></body></html>
