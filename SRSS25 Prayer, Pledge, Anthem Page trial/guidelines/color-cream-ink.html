<!-- @dsCard group="Colors" viewport="700x150" name="Cream & ink" subtitle="Light bands and body type — the counterweight to navy" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0}#c{box-sizing:border-box}.sw{display:flex;flex-direction:column;justify-content:flex-end;padding:10px;gap:2px}
.n{font:var(--fw-semibold) 11px/1.2 var(--font-body)}
.h{font:var(--fw-regular) 10px/1.2 var(--font-mono);opacity:.8}
.v{font:var(--fw-regular) 9px/1.2 var(--font-body);opacity:.7}#c{display:grid;grid-template-columns:repeat(9,1fr);height:150px}</style></head><body>
<div id="c">
<div class="sw" style="background:#FBF9F4;color:#14161A;box-shadow:inset 0 0 0 1px #EDE7D9"><span class="n">cream-50</span><span class="h">#FBF9F4</span></div>
<div class="sw" style="background:#F6F2E9;color:#14161A"><span class="n">cream-100</span><span class="h">#F6F2E9</span></div>
<div class="sw" style="background:#EDE7D9;color:#14161A"><span class="n">cream-200</span><span class="h">#EDE7D9</span></div>
<div class="sw" style="background:#DED7C7;color:#14161A"><span class="n">cream-300</span><span class="h">#DED7C7</span><span class="v">hairline</span></div>
<div class="sw" style="background:#A8AEB8;color:#14161A"><span class="n">ink-300</span><span class="h">#A8AEB8</span></div>
<div class="sw" style="background:#8A909B;color:#fff"><span class="n">ink-400</span><span class="h">#8A909B</span><span class="v">muted</span></div>
<div class="sw" style="background:#606671;color:#fff"><span class="n">ink-600</span><span class="h">#606671</span><span class="v">body ink</span></div>
<div class="sw" style="background:#3A3F47;color:#fff"><span class="n">ink-700</span><span class="h">#3A3F47</span></div>
<div class="sw" style="background:#14161A;color:#fff"><span class="n">ink-900</span><span class="h">#14161A</span></div>
</div></body></html>
