<!-- @dsCard group="Colors" viewport="700x150" name="Navy — brand ground" subtitle="Every SRSS surface starts here; --navy-800 is the default page ground" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0}#c{box-sizing:border-box}.sw{display:flex;flex-direction:column;justify-content:flex-end;padding:10px;gap:2px}
.n{font:var(--fw-semibold) 11px/1.2 var(--font-body)}
.h{font:var(--fw-regular) 10px/1.2 var(--font-mono);opacity:.8}
.v{font:var(--fw-regular) 9px/1.2 var(--font-body);opacity:.7}#c{display:grid;grid-template-columns:repeat(8,1fr);height:150px}</style></head><body>
<div id="c">
<div class="sw" style="background:#07152F;color:#fff"><span class="n">navy-950</span><span class="h">#07152F</span><span class="v">heading ink</span></div>
<div class="sw" style="background:#060F26;color:#fff"><span class="n">navy-900</span><span class="h">#060F26</span><span class="v">footer, ticker</span></div>
<div class="sw" style="background:#0A1A3C;color:#fff"><span class="n">navy-800</span><span class="h">#0A1A3C</span><span class="v">page ground</span></div>
<div class="sw" style="background:#0F2350;color:#fff"><span class="n">navy-700</span><span class="h">#0F2350</span><span class="v">raised panel</span></div>
<div class="sw" style="background:#16315F;color:#fff"><span class="n">navy-600</span><span class="h">#16315F</span><span class="v">link ink</span></div>
<div class="sw" style="background:#1E4079;color:#fff"><span class="n">navy-500</span><span class="h">#1E4079</span><span class="v">micro-labels</span></div>
<div class="sw" style="background:#3C5F9E;color:#fff"><span class="n">navy-400</span><span class="h">#3C5F9E</span><span class="v">on-navy accents</span></div>
<div class="sw" style="background:#8DA2C6;color:#0A1A3C"><span class="n">navy-200</span><span class="h">#8DA2C6</span><span class="v">charts only</span></div>
</div></body></html>
