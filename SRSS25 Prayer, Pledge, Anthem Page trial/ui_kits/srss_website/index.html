<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Sekolah Rendah Sathya Sai — SRSS25 UI kit</title>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>html,body{margin:0;background:var(--navy-800)}#root{min-width:1280px}a{color:var(--text-link)}a:hover{color:var(--text-link-hover)}</style></head>
<body><div id="root"></div>
<script type="text/babel" src="Shell.jsx"></script>
<script type="text/babel" src="HomeScreen.jsx"></script>
<script type="text/babel" src="ValuesScreen.jsx"></script>
<script type="text/babel" src="JubileeScreen.jsx"></script>
<script type="text/babel" src="AdmissionsScreen.jsx"></script>
<script type="text/babel" src="StoriesScreen.jsx"></script>
<script type="text/babel" src="SongsPrayersScreen.jsx"></script>
<script type="text/babel">
function App(){
  const [route,setRoute]=React.useState('Home');
  const go=(item)=>{
    const map={'About':'Home','Learning':'Stories','School Life':'Songs','Values':'Values','Community':'Stories','Resources':'Songs','Admissions':'Admissions','Jubilee':'Jubilee','Home':'Home','Stories':'Stories','Songs':'Songs'};
    setRoute(map[item]||'Home'); window.scrollTo({top:0});
  };
  const active={Home:'About',Values:'Values',Jubilee:'About',Admissions:null,Stories:'Community',Songs:'Resources'}[route];
  const Screen={Home:window.HomeScreen,Values:window.ValuesScreen,Jubilee:window.JubileeScreen,Admissions:window.AdmissionsScreen,Stories:window.StoriesScreen,Songs:window.SongsPrayersScreen}[route];
  const Shell=window.Shell;
  return (<Shell active={active} onNavigate={go}><Screen onNavigate={go}/></Shell>);
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script></body></html>
